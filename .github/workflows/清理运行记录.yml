name: 清理运行记录
on:
  workflow_dispatch:
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 只留最新 10 条旧运行记录
        env:
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp=$(mktemp)
          del=$(mktemp)
          page=1
          while true; do
            batch=$(gh api "repos/$REPO/actions/runs?per_page=100&page=$page" --jq '.workflow_runs[] | "\(.created_at) \(.id)"')
            if [ -z "$batch" ]; then break; fi
            printf '%s\n' "$batch" >> "$tmp"
            count=$(printf '%s\n' "$batch" | wc -l)
            if [ "$count" -lt 100 ]; then break; fi
            page=$((page + 1))
          done
          total=$(wc -l < "$tmp")
          sort -r "$tmp" | awk '{print $2}' | grep -v "^$CURRENT_RUN_ID$" | tail -n +11 > "$del"
          to_delete=$(wc -l < "$del")
          echo "共 $total 条，保留最新 10 条旧记录，删除 $to_delete 条"
          while read -r id; do
            if gh api -X DELETE "repos/$REPO/actions/runs/$id" > /dev/null 2>&1; then
              echo "已删 $id"
            else
              echo "删除失败 $id"
            fi
            sleep 0.2
          done < "$del"
          echo "完成"
